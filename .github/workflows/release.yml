name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Stash arm64 binary
        run: cp .build/release/clipslots clipslots-arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64

      - name: Stash x86_64 binary
        run: cp .build/release/clipslots clipslots-x86_64

      - name: Create universal binary
        run: lipo -create clipslots-arm64 clipslots-x86_64 -output clipslots

      - name: Ad-hoc sign
        run: codesign -s - clipslots

      - name: Verify universal binary
        run: file clipslots && lipo -info clipslots

      - name: Build .pkg
        run: |
          mkdir -p pkg-root/usr/local/bin
          cp clipslots pkg-root/usr/local/bin/
          chmod +x pkg-root/usr/local/bin/clipslots

          pkgbuild \
            --root pkg-root \
            --identifier com.clipslots.pkg \
            --version "${{ steps.version.outputs.VERSION }}" \
            --install-location / \
            --scripts scripts/ \
            "ClipSlots-${{ steps.version.outputs.VERSION }}.pkg"

          # Also publish under a stable filename so README / landing page can link
          # directly to /releases/latest/download/ClipSlots.pkg
          cp "ClipSlots-${{ steps.version.outputs.VERSION }}.pkg" "ClipSlots.pkg"

      - name: Create binary tarball
        run: |
          tar czf "clipslots-${{ steps.version.outputs.VERSION }}-universal.tar.gz" clipslots

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Pull the lines between `## [VERSION]` and the next `## [` header.
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/        { exit }
            capture                    { print }
          ' CHANGELOG.md)
          # Trim leading/trailing blank lines.
          SECTION=$(printf '%s\n' "$SECTION" | awk 'NF {p=1} p' | awk 'BEGIN{RS=""} {print}')
          {
            echo 'NOTES<<CHANGELOG_EOF'
            if [ -n "$SECTION" ]; then
              echo "## What's new in ${VERSION}"
              echo
              echo "$SECTION"
              echo
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipSlots ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}
            ## Install

            **Option A — Download the installer (recommended)**

            1. Download `ClipSlots-${{ steps.version.outputs.VERSION }}.pkg` below
            2. Double-click to install (if macOS warns about an unverified developer, right-click the file and choose **Open**)
            3. The installer copies `clipslots` to `/usr/local/bin` and opens Accessibility settings
            4. Toggle **clipslots** on in the Accessibility list
            5. Open Terminal and run `clipslots start`

            **Option B — Build from source**

            ```bash
            git clone https://github.com/olafglad/clipSlots.git
            cd clipSlots
            swift build -c release
            sudo cp .build/release/clipslots /usr/local/bin/
            clipslots permissions
            clipslots start
            ```

            **Option C — Download the raw binary**

            Download `clipslots-${{ steps.version.outputs.VERSION }}-universal.tar.gz`, extract, copy to `/usr/local/bin`, and run `clipslots permissions`.
          files: |
            ClipSlots-${{ steps.version.outputs.VERSION }}.pkg
            ClipSlots.pkg
            clipslots-${{ steps.version.outputs.VERSION }}-universal.tar.gz

      - name: Compute tarball sha256
        id: sha
        run: |
          SHA=$(shasum -a 256 "clipslots-${{ steps.version.outputs.VERSION }}-universal.tar.gz" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: olafglad/homebrew-clipslots
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump formula
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.sha }}"
          cd tap
          # macos sed needs -i ''; ubuntu sed needs -i. Runner is macos-14, so '' form.
          sed -i '' -E "s|^  url \".*\"|  url \"https://github.com/olafglad/clipSlots/releases/download/v${VERSION}/clipslots-${VERSION}-universal.tar.gz\"|" Formula/clipslots.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/clipslots.rb
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" Formula/clipslots.rb
          echo "--- updated formula ---"
          cat Formula/clipslots.rb

      - name: Commit and push tap
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clipslots.rb
          if git diff --staged --quiet; then
            echo "Formula already up-to-date; nothing to commit."
            exit 0
          fi
          git commit -m "clipslots ${VERSION}"
          git push origin main
